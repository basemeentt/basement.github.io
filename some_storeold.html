<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Some Store</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout concept: одна сцена на весь экран. Небо и улица живут по системным часам, в центре уличный автомат
   с четырьмя товарами; справа на корпусе панель с экраном и клавиатурой. Карточка товара выезжает поверх сцены
   как бумажный ценник/чек. Единый визуальный мир, поэтому светлой/тёмной темы нет, цвета заданы явно. */
:root {
  color-scheme: dark;
  /* палитра */
  --ink: #0b0d12;          /* ночной асфальт, фон за сценой */
  --paper: #f3f4f0;        /* карточка товара */
  --paper-ink: #12141a;
  --steel-hi: #dfe3e7;     /* сталь корпуса автомата (день) */
  --steel-lo: #8b929a;
  --lcd-bg: #04191b;       /* экран автомата */
  --lcd-fg: #86f4e0;
  --accent: #ff7a1a;       /* оранжевая кнопка как на корпусе автомата */
  --warn: #ffb347;
  --bad: #ff6b6b;
  /* типографика */
  --f-display: "Unbounded", "Onest", system-ui, sans-serif;
  --f-body: "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-lcd: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  /* переменные сцены; их пересчитывает JS по времени суток */
  --sky-top: #5a9fe6; --sky-bot: #bfe0f6;
  --amb: rgba(255,255,255,0);
  --night: 0; --lamp: 0;
  --wall: #9a9b97; --road: #5a5c60; --walk: #8a8a86; --bld: #c6c0b6; --pole: #4a4a48;
  --steel-a: #dfe3e7; --steel-b: #b4bac1; --steel-c: #8b929a;
  --glow: 0;
  --groundH: 16vh;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; overflow: hidden; background: var(--ink); color: #fff; font-family: var(--f-body); }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ---------- мир ---------- */
.world { position: fixed; inset: 0; overflow: hidden; transform-origin: 72% 58%; transition: transform 2.6s cubic-bezier(.2,.7,.15,1), filter 1.6s ease; }
.world.approach { transform: scale(1.7); }
.world.blurred { filter: blur(5px) brightness(.8); }

.sky { position: absolute; inset: 0; background: linear-gradient(to bottom, var(--sky-top), var(--sky-bot) 78%); z-index: 1; }
.stars { position: absolute; inset: 0 0 45% 0; opacity: var(--night); pointer-events: none; }
.stars i { position: absolute; width: 2px; height: 2px; border-radius: 50%; background: #fff; opacity: .8; }
.orb { position: absolute; width: 7vmin; height: 7vmin; border-radius: 50%; transform: translate(-50%, -50%); will-change: left, top; }
.sun { background: radial-gradient(circle, #fff7d6 0 35%, rgba(255,226,140,.65) 55%, rgba(255,200,100,0) 72%); }
.moon { background: radial-gradient(circle at 38% 38%, #f3f6ff 0 55%, #cdd6ea 72%, rgba(205,214,234,0) 74%); box-shadow: 0 0 5vmin rgba(190,205,255,.35); width: 5vmin; height: 5vmin; }

.houses { position: absolute; left: 0; bottom: var(--groundH); height: 54vh; width: auto; aspect-ratio: 700 / 520; z-index: 2; }
.houses .b { fill: var(--bld); }
.houses .w { fill: #ffd58a; opacity: calc(var(--night) * .85); }
.pole { position: absolute; left: 1vw; bottom: calc(var(--groundH) * .42); height: 98vh; width: auto; aspect-ratio: 220 / 900; z-index: 2; overflow: visible; }
.pole .p { fill: var(--pole); }
.pole .wire { stroke: var(--pole); fill: none; stroke-width: 1.6; }

.wall { position: absolute; top: 0; right: 0; bottom: var(--groundH); width: calc(var(--w) + 15vw); z-index: 2;
  background: linear-gradient(100deg, color-mix(in srgb, var(--wall) 88%, #fff) 0%, var(--wall) 40%, color-mix(in srgb, var(--wall) 82%, #000) 100%); box-shadow: inset 14px 0 30px -18px rgba(0,0,0,.45); }
.wall::before, .wall::after { content: ""; position: absolute; top: 7.5vh; width: 1.1vh; height: 1.1vh; border-radius: 50%; background: rgba(0,0,0,.32); }
.wall::before { left: 14%; } .wall::after { right: 24%; }
.ground { position: absolute; left: 0; right: 0; bottom: 0; height: var(--groundH); z-index: 2;
  background: linear-gradient(to bottom, var(--walk) 0 46%, color-mix(in srgb, var(--walk) 60%, #000) 46% 49%, var(--road) 49% 100%); }
.ground::after { content: ""; position: absolute; left: 0; right: 0; bottom: 18%; height: .6vh; background: repeating-linear-gradient(90deg, rgba(255,255,255,.35) 0 6vw, transparent 6vw 12vw); opacity: calc(1 - var(--night) * .6); }

.ambient { position: absolute; inset: 0; background: var(--amb); mix-blend-mode: multiply; z-index: 3; pointer-events: none; }

.lamp { position: absolute; left: 25vw; bottom: calc(var(--groundH) * .42); height: 76vh; width: auto; aspect-ratio: 420 / 760; z-index: 4; overflow: visible; pointer-events: none; }
.lamp .p { fill: var(--pole); }
.lamp .glow { opacity: var(--lamp); mix-blend-mode: screen; animation: flick 5s ease-in-out infinite; }
@keyframes flick { 0%,100% { opacity: var(--lamp); } 46% { opacity: calc(var(--lamp) * .93); } 52% { opacity: calc(var(--lamp) * .98); } }

/* ---------- автомат ---------- */
.machine { --w: min(calc(84vh * .74), 94vw, 640px); --u: calc(var(--w) / 37);
  position: absolute; right: 6vw; bottom: calc(var(--groundH) * .42); z-index: 5;
  width: var(--w); aspect-ratio: .74; font-size: var(--u);
  display: grid; grid-template-columns: minmax(0, 1fr) 8.4em; gap: 1.1em; padding: 1.4em; border-radius: 1.5em;
  background: linear-gradient(160deg, var(--steel-a), var(--steel-b) 55%, var(--steel-c)); box-shadow: 0 1.2em 3em rgba(0,0,0,.35), 0 0 calc(var(--glow) * 5em) calc(var(--glow) * .8em) rgba(150,210,255,calc(var(--glow) * .28)); }
.world { --w: min(calc(84vh * .74), 94vw, 640px); }

.glass { position: relative; min-width: 0; display: grid; grid-template-rows: auto minmax(0, 1fr) minmax(0, 1fr) auto; border-radius: 1em; overflow: hidden;
  background: linear-gradient(180deg, #f6f8fb 0%, #dfe6ee 100%); box-shadow: inset 0 0 0 .22em #20252b, inset 0 .6em 1.6em rgba(0,0,0,.25); }
.glass::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 5;
  background: linear-gradient(118deg, rgba(255,255,255,.34) 0%, rgba(255,255,255,0) 34%, rgba(255,255,255,.07) 62%, rgba(255,255,255,0) 100%), linear-gradient(to bottom, color-mix(in srgb, var(--sky-bot) 40%, transparent), transparent 40%);
  opacity: calc(1 - var(--night) * .55); }
.led { height: .7em; margin: .9em 1.2em .5em; border-radius: .4em; background: #fff; box-shadow: 0 0 1.2em .3em rgba(255,255,255,.9), 0 0 3em 1em rgba(200,230,255,.5); }
.shelf { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 1em; padding: .6em 1.2em 0; align-items: end; border-bottom: .9em solid #fdfdfd; box-shadow: 0 .35em .5em -.2em rgba(0,0,0,.25); }
.slot { position: relative; display: grid; grid-template-rows: minmax(0, 1fr) auto; justify-items: center; align-items: end; gap: .4em; min-height: 0; padding: 0; border: 0; background: none; text-align: center; }
.bag { position: relative; width: 88%; height: 100%; min-height: 0; display: grid; place-items: center; padding: .5em; border-radius: .7em;
  background: linear-gradient(160deg, rgba(255,255,255,.65), rgba(200,214,230,.35)); border: .1em solid rgba(255,255,255,.9); box-shadow: 0 .2em .5em rgba(40,60,90,.25); transition: transform .25s ease, box-shadow .25s ease; }
.bag::before { content: ""; position: absolute; left: 8%; right: 8%; top: 0; height: .35em; background: rgba(255,255,255,.9); border-radius: 0 0 .3em .3em; }
.bag::after { content: ""; position: absolute; inset: 0; border-radius: inherit; background: linear-gradient(125deg, rgba(255,255,255,.55), transparent 35%); pointer-events: none; }
.bag img, .bag .ph { width: 100%; height: 100%; object-fit: contain; display: block; border-radius: .4em; }
.ph rect.bg { fill: #c9d3de; } .ph .hatch { stroke: rgba(255,255,255,.55); stroke-width: 3; } .ph text { fill: #4a5666; font-family: var(--f-lcd); font-weight: 600; }
.tag { display: inline-flex; align-items: stretch; margin-bottom: .6em; border-radius: .3em; overflow: hidden; background: #0b0b0c; color: #fff; font: 600 .95em var(--f-lcd); letter-spacing: .02em; box-shadow: 0 .15em .3em rgba(0,0,0,.35); }
.tag b { display: grid; place-items: center; min-width: 1.7em; background: var(--accent); color: #1a0e00; font-weight: 600; }
.tag span { padding: .25em .6em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.slot:hover .bag, .slot:focus-visible .bag { transform: translateY(-.25em); box-shadow: 0 .6em 1em rgba(40,60,90,.3); }
.slot.picked .bag { box-shadow: 0 0 0 .22em var(--accent), 0 0 1.6em .4em rgba(255,122,26,.55); }
.bay { position: relative; height: 3.6em; margin: .8em 1.2em 1.1em; border-radius: .7em; overflow: hidden; background: linear-gradient(#0e1114, #1d2227); box-shadow: inset 0 .3em .8em rgba(0,0,0,.8); display: grid; place-items: center; }
.bay small { font: 500 .8em var(--f-lcd); letter-spacing: .3em; color: #6d7782; }
.bay .drop { position: absolute; inset: .3em 40% .3em 40%; display: grid; place-items: center; animation: drop 1s cubic-bezier(.3,1.4,.5,1) both; }
.bay .drop .bag { width: 100%; }
@keyframes drop { from { transform: translateY(-200%) rotate(-8deg); opacity: 0; } 30% { opacity: 1; } to { transform: none; opacity: 1; } }

.panel { display: flex; flex-direction: column; gap: .9em; min-width: 0; padding: .9em .8em; border-radius: 1em; background: linear-gradient(180deg, #1d2024, #0f1114); box-shadow: inset 0 0 0 .15em #31363c; }
.plate { font: 700 .9em var(--f-display); letter-spacing: .02em; text-align: center; color: #dfe4ea; padding: .3em 0 .1em; }
.plate small { display: block; margin-top: .3em; font: 500 .62em var(--f-lcd); letter-spacing: .25em; color: #7f8a96; }
.lcd { position: relative; min-height: 9.4em; display: flex; flex-direction: column; justify-content: space-between; gap: .4em; padding: .7em .75em; border-radius: .5em; background: var(--lcd-bg); color: var(--lcd-fg);
  font: 500 .9em/1.25 var(--f-lcd); text-shadow: 0 0 .5em rgba(60,240,205,.6); box-shadow: inset 0 0 1em rgba(0,0,0,.9), 0 0 .8em rgba(40,200,180,.25); overflow: hidden; }
.lcd::after { content: ""; position: absolute; inset: 0; background: repeating-linear-gradient(to bottom, rgba(0,0,0,.22) 0 1px, transparent 1px 3px); pointer-events: none; }
.lcd .l1 { text-transform: uppercase; letter-spacing: .04em; overflow-wrap: anywhere; }
.lcd .code { font-size: 1.9em; letter-spacing: .12em; font-variant-numeric: tabular-nums; }
.lcd .code i { font-style: normal; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.lcd.warn { color: var(--warn); text-shadow: 0 0 .5em rgba(255,179,71,.6); } .lcd.bad { color: var(--bad); text-shadow: 0 0 .5em rgba(255,107,107,.6); }
.keys { display: grid; grid-template-columns: repeat(3, 1fr); gap: .55em; }
.key { aspect-ratio: 1.15; border: 0; border-radius: .5em; font: 600 1.35em var(--f-lcd); color: #1b1f24; background: linear-gradient(#f1f3f5, #b3b9c0); box-shadow: 0 .18em 0 #6b727a, 0 .3em .5em rgba(0,0,0,.5); transition: transform .06s ease, box-shadow .06s ease; }
.key:active, .key.press { transform: translateY(.14em); box-shadow: 0 .04em 0 #6b727a, 0 .1em .2em rgba(0,0,0,.5); }
.key.clr { font-size: 1.05em; color: #8a1f1f; } .key.ok { font-size: 1.05em; color: #1a0e00; background: linear-gradient(#ffa254, var(--accent)); box-shadow: 0 .18em 0 #a24a07, 0 .3em .5em rgba(0,0,0,.5); }
.reader { margin-top: auto; display: grid; gap: .5em; }
.reader i { display: block; height: .5em; border-radius: .3em; background: #060708; box-shadow: inset 0 0 0 .1em #2b3036; }
.reader i.on { background: #123a2f; box-shadow: inset 0 0 0 .1em #2b3036, 0 0 .6em rgba(60,240,200,.5); }

/* ---------- вход ---------- */
.gate { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px)); text-align: center;
  background: radial-gradient(ellipse at center, rgba(5,8,16,.35), rgba(5,8,16,.82)); transition: opacity 1.2s ease, visibility 1.2s; }
.gate.gone { opacity: 0; visibility: hidden; pointer-events: none; }
.gate h1 { margin: 0 0 .35em; font: 700 clamp(2.2rem, 8vw, 4.6rem)/1 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
.gate p { margin: 0 auto 1.8rem; max-width: 34ch; font-size: 1.05rem; line-height: 1.45; color: #cfd6e2; text-wrap: balance; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .6em; min-height: 3.2rem; padding: .8em 1.6em; border: 0; border-radius: .9em; font: 600 1.05rem var(--f-body); color: #1a0e00; background: var(--accent); box-shadow: 0 .5em 1.6em rgba(255,122,26,.35); text-decoration: none; transition: transform .15s ease, box-shadow .15s ease; }
.btn:hover { transform: translateY(-2px); box-shadow: 0 .8em 2em rgba(255,122,26,.45); }
.btn.ghost { color: var(--paper-ink); background: transparent; box-shadow: inset 0 0 0 2px rgba(18,20,26,.25); }
.btn.ghost:hover { box-shadow: inset 0 0 0 2px var(--paper-ink); transform: none; }
.gate small { display: block; margin-top: 1.2rem; font: 500 .78rem var(--f-lcd); letter-spacing: .14em; color: #8f9bb0; text-transform: uppercase; }

/* ---------- карточка товара ---------- */
.card-wrap { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: rgba(3,6,14,.74); backdrop-filter: blur(6px); animation: fade .3s ease both; }
.card { width: min(880px, 100%); max-height: 100%; overflow: auto; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); border-radius: 1.2rem; background: var(--paper); color: var(--paper-ink); box-shadow: 0 2rem 5rem rgba(0,0,0,.6); animation: rise .45s cubic-bezier(.2,.8,.2,1) both; }
.card .pic { display: grid; place-items: center; padding: clamp(18px, 4vw, 36px); background: linear-gradient(160deg, #1a2230, #0b0f18); min-height: 280px; }
.card .pic .bag { width: min(100%, 300px); aspect-ratio: .8; height: auto; padding: 1rem; border-radius: 1.2rem; }
.card .info { display: flex; flex-direction: column; gap: 1rem; min-width: 0; padding: clamp(20px, 4vw, 36px); }
.chips { display: flex; gap: .5rem; flex-wrap: wrap; font: 600 .78rem var(--f-lcd); letter-spacing: .08em; text-transform: uppercase; }
.chips span { padding: .35em .7em; border-radius: .4em; background: #e6e8e2; }
.chips span.code { background: var(--accent); color: #1a0e00; }
.card h2 { margin: 0; font: 700 clamp(1.5rem, 4vw, 2.1rem)/1.1 var(--f-display); letter-spacing: -.02em; text-wrap: balance; }
.price { font: 600 1.7rem var(--f-display); font-variant-numeric: tabular-nums; }
.card p { margin: 0; line-height: 1.55; color: #3a3f48; max-width: 60ch; }
.card dl { display: grid; grid-template-columns: auto 1fr; gap: .45rem 1.2rem; margin: 0; padding: .9rem 0; border-block: 1px dashed #b9bdb4; font-size: .95rem; }
.card dt { color: #6b7079; } .card dd { margin: 0; font-weight: 500; }
.actions { display: flex; gap: .7rem; flex-wrap: wrap; margin-top: auto; }
.card .hint { font-size: .8rem; color: #7a7f88; }
@keyframes fade { from { opacity: 0; } } @keyframes rise { from { opacity: 0; transform: translateY(24px) scale(.97); } }

/* ---------- служебное ---------- */
.mute { position: fixed; z-index: 15; top: max(14px, env(safe-area-inset-top, 0px)); right: max(14px, env(safe-area-inset-right, 0px)); width: 2.9rem; height: 2.9rem; display: grid; place-items: center; border: 0; border-radius: 50%; background: rgba(8,12,22,.6); backdrop-filter: blur(6px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
.mute svg { width: 1.4rem; height: 1.4rem; fill: none; stroke: #fff; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.mute .x { display: none; } .mute[aria-pressed="true"] .wave { display: none; } .mute[aria-pressed="true"] .x { display: block; }
.timebox { position: fixed; z-index: 15; left: max(14px, env(safe-area-inset-left, 0px)); bottom: max(12px, env(safe-area-inset-bottom, 0px)); display: grid; gap: .5rem; justify-items: start; }
.chip { display: inline-flex; align-items: center; gap: .55rem; min-height: 2.4rem; padding: .35rem .9rem; border: 0; border-radius: 2rem; background: rgba(8,12,22,.62); backdrop-filter: blur(6px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); font: 500 .8rem var(--f-lcd); letter-spacing: .06em; color: #e5eaf3; }
.chip i { width: .55rem; height: .55rem; border-radius: 50%; background: var(--accent); }
.timepanel { display: flex; align-items: center; gap: .7rem; padding: .6rem .9rem; border-radius: 1rem; background: rgba(8,12,22,.78); backdrop-filter: blur(8px); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); font: 500 .78rem var(--f-lcd); }
.timepanel input[type=range] { width: min(46vw, 240px); accent-color: var(--accent); }
.timepanel button { min-height: 2rem; padding: .2rem .8rem; border: 0; border-radius: 1rem; background: rgba(255,255,255,.14); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }

/* ---------- узкий экран: панель уходит под стекло ---------- */
@media (max-width: 820px), (max-aspect-ratio: 1/1) {
  .world { --w: min(94vw, 47vh, 520px); }
  .machine { right: auto; left: 50%; transform: translateX(-50%); width: var(--w); aspect-ratio: auto; grid-template-columns: 1fr; padding: 1.2em; gap: 1em; }
  .glass { aspect-ratio: 1 / 1.3; }
  .panel { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); align-items: start; gap: 1em; padding: .9em; }
  .plate, .reader { display: none; }
  .keys { gap: .45em; }
  .key { aspect-ratio: 1.3; font-size: 1.1em; }
  .lcd { min-height: 0; height: 100%; }
  .wall { width: 100%; }
  .pole { left: -4vw; height: 78vh; opacity: .9; }
  .lamp { left: -2vw; height: 64vh; }
  .houses { display: none; }
  .card { grid-template-columns: minmax(0, 1fr); }
  .card .pic { min-height: 220px; }
  .world.approach { transform: scale(1.5); transform-origin: 50% 60%; }
}
@media (prefers-reduced-motion: reduce) { .world, .gate { transition-duration: .01s; } .lamp .glow, .lcd .code i { animation: none; } .bag { transition: none; } }
</style>

</head>
<body>
<div class="world approach blurred" id="world">
  <div class="sky" id="sky"><div class="stars" id="stars"></div><div class="orb sun" id="sun"></div><div class="orb moon" id="moon"></div></div>

  <svg class="houses" viewBox="0 0 700 520" aria-hidden="true">
    <polygon class="b" points="0,520 0,150 210,90 210,520"/>
    <rect class="b" x="215" y="230" width="190" height="290"/>
    <polygon class="b" points="400,520 400,170 520,120 640,170 640,520"/>
    <g class="w">
      <rect x="30" y="200" width="46" height="60"/><rect x="110" y="200" width="46" height="60"/>
      <rect x="30" y="320" width="46" height="60"/><rect x="110" y="320" width="46" height="60"/>
      <rect x="240" y="280" width="40" height="52"/><rect x="320" y="280" width="40" height="52"/>
      <rect x="440" y="230" width="40" height="52"/><rect x="520" y="230" width="40" height="52"/>
      <rect x="440" y="340" width="40" height="52"/><rect x="520" y="340" width="40" height="52"/>
    </g>
  </svg>

  <svg class="pole" viewBox="0 0 220 900" aria-hidden="true">
    <defs>
      <linearGradient id="wf" x1="0" x2="1"><stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
      <mask id="wm" maskUnits="userSpaceOnUse" x="-400" y="0" width="1200" height="400"><rect x="-400" y="0" width="1200" height="400" fill="url(#wf)"/></mask>
    </defs>
    <rect class="p" x="100" y="20" width="16" height="880"/>
    <rect class="p" x="36" y="74" width="144" height="8"/><rect class="p" x="58" y="126" width="100" height="7"/>
    <g class="p"><rect x="44" y="64" width="5" height="10"/><rect x="98" y="64" width="5" height="10"/><rect x="152" y="64" width="5" height="10"/><rect x="66" y="116" width="5" height="10"/><rect x="140" y="116" width="5" height="10"/></g>
    <rect class="p" x="116" y="230" width="44" height="74" rx="8"/>
    <g mask="url(#wm)">
      <path class="wire" d="M46 66 C -80 120 -240 100 -380 150"/><path class="wire" d="M100 66 C -20 130 -160 120 -380 190"/>

<script>
(() => {
'use strict';

/* =====================================================================
   НАСТРОЙКИ. Здесь меняешь всё, что нужно для болванки.
   ===================================================================== */
const CONFIG = {
  storeName: 'some store',
  currency: '₽',
  telegramUsername: 'your_username',   // <- ЗАМЕНИ на свой Telegram (без @): откроется чат с готовым текстом заказа
  orderText: p => `Здравствуйте! Хочу заказать: ${p.name} (код ${p.code}, ${fmtPrice(p.price)}).`,
  sound: true,                          // звуки города и автомата
  approachMs: 2600,                     // длительность «подхода» к автомату (позже можно заменить своей анимацией, см. playApproach)
  forceHour: null,                      // например 22.5 = 22:30 для отладки; null = время системы
};

/* Товары. image: '' = плейсхолдер "ФОТО". Подставь путь или data:-ссылку на свою фотографию.
   Описания ниже примерные, замени своими. */
const PRODUCTS = [
  { code: 1, name: 'Рубашка в полоску', price: 8000, image: '',
    desc: 'Лёгкая рубашка прямого кроя из плотного хлопка. Запечатана в плёнку, как в автомате.',
    details: { 'Размеры': 'S, M, L', 'Состав': 'хлопок 100%', 'Цвет': 'голубая полоска', 'В наличии': '3 шт.' } },
  { code: 2, name: 'Футболка с принтом', price: 3500, image: '',
    desc: 'Базовая футболка свободного кроя. Принт на груди, мягкая ткань.',
    details: { 'Размеры': 'M, L, XL', 'Состав': 'хлопок 100%', 'Цвет': 'белый', 'В наличии': '5 шт.' } },
  { code: 3, name: 'Кроссовки', price: 9000, image: '',
    desc: 'Классические низкие кроссовки. Новые, в коробке-пакете, размеры уточняйте в чате.',
    details: { 'Размеры': '38–45', 'Материал': 'кожа, замша', 'Цвет': 'белый с чёрным', 'В наличии': '2 пары' } },
  { code: 4, name: 'Серьги-кольца', price: 2000, image: '',
    desc: 'Тонкие кольца из стали, на картонной подложке. Подойдут к любой одежде.',
    details: { 'Материал': 'сталь', 'Диаметр': '3 см', 'Цвет': 'серебро', 'В наличии': '12 пар' } },
];

/* =====================================================================
   УТИЛИТЫ
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const nf = new Intl.NumberFormat('ru-RU');
function fmtPrice(n) { return `${nf.format(n)} ${CONFIG.currency}`; }
const root = document.documentElement;
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* =====================================================================
   ВРЕМЯ СУТОК (по системным часам)
   ===================================================================== */
const hex = h => [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16));
const mix = (a, b, t) => a.map((v, i) => v + (b[i] - v) * t);
const rgb = c => `rgb(${c.map(v => Math.round(v)).join(',')})`;
/* [час, верх неба, низ неба, цвет затемнения, сила затемнения, «ночность»] */
const KEYS = [
  [0,    '#050816', '#0d1530', '#0a1030', .62, 1],
  [5,    '#0b1330', '#2a3158', '#101840', .55, .85],
  [6.5,  '#4c5f9a', '#f0a77c', '#a8805a', .18, .35],
  [8,    '#79a8de', '#cfe2ee', '#ffffff', 0,   .05],
  [12,   '#5a9fe6', '#bfe0f6', '#ffffff', 0,   0],
  [16.5, '#6fa2dc', '#ead9b9', '#fff0d8', .05, 0],
  [18.5, '#34508f', '#f08a58', '#c98a60', .15, .25],
  [20,   '#182148', '#6a4a7c', '#3a3560', .38, .65],
  [21.5, '#0a1130', '#1b2750', '#0a1030', .58, .95],
  [24,   '#050816', '#0d1530', '#0a1030', .62, 1],
].map(k => ({ h: k[0], top: hex(k[1]), bot: hex(k[2]), amb: hex(k[3]), ambA: k[4], night: k[5] }));
const DAY = { wall: hex('#9a9b97'), road: hex('#5a5c60'), walk: hex('#8a8a86'), bld: hex('#c6c0b6'), pole: hex('#4a4a48'), steel: [hex('#dfe3e7'), hex('#b4bac1'), hex('#8b929a')] };
const NIGHT = { wall: hex('#2a2d33'), road: hex('#121318'), walk: hex('#1f2128'), bld: hex('#181b27'), pole: hex('#0e0f14'), steel: [hex('#5b616a'), hex('#3d424a'), hex('#2a2e34')] };

function sample(h) {
  let i = 0;
  while (i < KEYS.length - 2 && h >= KEYS[i + 1].h) i++;
  const a = KEYS[i], b = KEYS[i + 1], t = clamp((h - a.h) / (b.h - a.h));
  return { top: mix(a.top, b.top, t), bot: mix(a.bot, b.bot, t), amb: mix(a.amb, b.amb, t), ambA: a.ambA + (b.ambA - a.ambA) * t, night: a.night + (b.night - a.night) * t };
}
function currentHour() {
  if (CONFIG.forceHour != null) return CONFIG.forceHour;
  const d = new Date();
  return d.getHours() + d.getMinutes() / 60 + d.getSeconds() / 3600;
}
function partOfDay(h) { return h >= 21.5 || h < 5 ? 'ночь' : h < 8 ? 'утро' : h < 17 ? 'день' : 'вечер'; }
function pad2(n) { return String(Math.floor(n)).padStart(2, '0'); }

let lastDay = 1;
function applyTime() {
  const h = currentHour(), s = sample(h), n = s.night;
  const set = (k, v) => root.style.setProperty(k, v);
  set('--sky-top', rgb(s.top)); set('--sky-bot', rgb(s.bot));
  set('--amb', `rgba(${s.amb.map(Math.round).join(',')},${s.ambA.toFixed(3)})`);
  set('--night', n.toFixed(3));
  const lamp = clamp((n - .22) / .4);
  set('--lamp', lamp.toFixed(3)); set('--glow', clamp(n * 1.1).toFixed(3));
  for (const k of ['wall', 'road', 'walk', 'bld', 'pole']) set('--' + k, rgb(mix(DAY[k], NIGHT[k], n)));
  ['a', 'b', 'c'].forEach((k, i) => set('--steel-' + k, rgb(mix(DAY.steel[i], NIGHT.steel[i], n * .8))));
  // солнце и луна
  const sun = $('sun'), moon = $('moon');
  const sp = (h - 6) / 13.5, mp = ((h + 24 - 19.5) % 24) / 10.5;
  const place = (el, p) => {
    const on = p >= 0 && p <= 1;
    el.style.opacity = on ? Math.pow(Math.sin(p * Math.PI), .5).toFixed(3) : 0;
    el.style.left = (10 + p * 36) + '%'; el.style.top = (66 - Math.sin(clamp(p) * Math.PI) * 52) + '%';
  };
  place(sun, sp); place(moon, mp);
  $('timeText').textContent = `${pad2(h)}:${pad2((h % 1) * 60)} · ${partOfDay(h)}`;
  lastDay = 1 - n;
  Sound.update(n, lamp);
}

/* =====================================================================
   ЗВУК: город (процедурно, без файлов) и автомат
   ===================================================================== */
const Sound = {
  ctx: null, master: null, on: false, muted: false, g: {},
  start() {
    if (!CONFIG.sound || this.ctx) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    const c = this.ctx;
    this.master = c.createGain(); this.master.gain.value = .9; this.master.connect(c.destination);
    this.brown = this.buf(c, 'brown'); this.white = this.buf(c, 'white');
    // дорога: коричневый шум через фильтр с медленной «волной»
    const road = this.loop(this.brown, 'lowpass', 420, .32);
    const lfo = c.createOscillator(); lfo.frequency.value = .07;
    const lg = c.createGain(); lg.gain.value = .1; lfo.connect(lg); lg.connect(road.gain); lfo.start();
    // воздух города
    this.loop(this.white, 'bandpass', 2400, .012, .4);
    // сверчки (ночью)
    const cr = c.createOscillator(); cr.frequency.value = 4300;
    const crAmp = c.createGain(); crAmp.gain.value = 0;
    const crLfo = c.createOscillator(); crLfo.frequency.value = 27;
    const crDepth = c.createGain(); crDepth.gain.value = 0;
    crLfo.connect(crDepth); crDepth.connect(crAmp.gain); cr.connect(crAmp); crAmp.connect(this.master); cr.start(); crLfo.start();
    this.g.cricket = crAmp; this.g.cricketDepth = crDepth;
    // гул фонаря
    const hum = c.createOscillator(); hum.frequency.value = 100;
    const hum2 = c.createOscillator(); hum2.frequency.value = 200;
    const hg = c.createGain(); hg.gain.value = 0; hum.connect(hg); hum2.connect(hg); hg.connect(this.master); hum.start(); hum2.start();
    this.g.hum = hg;
    this.on = true;
    this.scheduleCars(); this.scheduleBirds();
    this.update(1 - lastDay, clamp(((1 - lastDay) - .22) / .4));
    document.addEventListener('visibilitychange', () => { if (this.ctx) document.hidden ? this.ctx.suspend() : this.ctx.resume(); });
  },
  buf(c, kind) {
    const len = c.sampleRate * 3, b = c.createBuffer(1, len, c.sampleRate), d = b.getChannelData(0);
    let last = 0;
    for (let i = 0; i < len; i++) {
      const w = Math.random() * 2 - 1;
      if (kind === 'brown') { last = (last + .02 * w) / 1.02; d[i] = last * 3.5; } else d[i] = w;
    }
    return b;
  },
  loop(buffer, type, freq, gain, q = 1) {
    const c = this.ctx, s = c.createBufferSource(); s.buffer = buffer; s.loop = true;
    const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
    const g = c.createGain(); g.gain.value = gain; s.connect(f); f.connect(g); g.connect(this.master); s.start();
    return g;
  },
  update(night, lamp) {
    if (!this.on) return;
    const t = this.ctx.currentTime;
    this.g.cricket.gain.setTargetAtTime(.004 * night, t, 2);
    this.g.cricketDepth.gain.setTargetAtTime(.004 * night, t, 2);
    this.g.hum.gain.setTargetAtTime(.012 * lamp, t, 2);
  },
  setMuted(m) {
    this.muted = m;
    if (this.on) this.master.gain.setTargetAtTime(m ? 0 : .9, this.ctx.currentTime, .1);
  },
  scheduleCars() {
    const run = () => {
      if (this.on && !document.hidden && !this.muted) this.car();
      setTimeout(run, (6 + Math.random() * 11) * 1000 * (1 + (1 - lastDay) * .8));
    };
    setTimeout(run, 2500);
  },
  car() {
    const c = this.ctx, t = c.currentTime, dur = 4 + Math.random() * 2, dir = Math.random() < .5 ? -1 : 1;
    const s = c.createBufferSource(); s.buffer = this.brown; s.loop = true;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = .8;
    bp.frequency.setValueAtTime(260, t); bp.frequency.linearRampToValueAtTime(720, t + dur * .5); bp.frequency.linearRampToValueAtTime(260, t + dur);
    const g = c.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.55, t + dur * .5); g.gain.linearRampToValueAtTime(0, t + dur);
    const pan = c.createStereoPanner ? c.createStereoPanner() : null;
    if (pan) { pan.pan.setValueAtTime(-.9 * dir, t); pan.pan.linearRampToValueAtTime(.9 * dir, t + dur); }
    s.connect(bp); bp.connect(g); g.connect(pan || this.master); if (pan) pan.connect(this.master);
    s.start(t); s.stop(t + dur + .1);
  },
  scheduleBirds() {
    const run = () => {
      if (this.on && !document.hidden && !this.muted && lastDay > .35) this.bird();
      setTimeout(run, (2 + Math.random() * 6) * 1000);
    };
    setTimeout(run, 1500);
  },
  bird() {
    const c = this.ctx; let t = c.currentTime;
    const pan = c.createStereoPanner ? c.createStereoPanner() : null; if (pan) pan.pan.value = Math.random() * 1.6 - .8;
    for (let i = 0, n = 2 + Math.floor(Math.random() * 3); i < n; i++, t += .13) {
      const o = c.createOscillator(), g = c.createGain(), f0 = 2400 + Math.random() * 1400;
      o.type = 'sine'; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(f0 * 1.45, t + .08);
      g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(.03 * lastDay, t + .02); g.gain.linearRampToValueAtTime(0, t + .1);
      o.connect(g); g.connect(pan || this.master); o.start(t); o.stop(t + .12);
    }
    if (pan) pan.connect(this.master);
  },
  beep(f, d = .06, type = 'square', v = .035, at = 0) {
    if (!this.on || this.muted) return;
    const c = this.ctx, t = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = f; g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + .02);
  },
  key() { this.beep(1250, .04, 'square', .03); },
  ok() { this.beep(880, .09, 'square', .035); this.beep(1320, .14, 'square', .035, .1); },
  err() { this.beep(190, .16, 'square', .04); this.beep(150, .2, 'square', .04, .2); },
  dispense() {
    if (!this.on || this.muted) return;
    const c = this.ctx, t = c.currentTime + .15;
    const s = c.createBufferSource(); s.buffer = this.white;
    const lp = c.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    const g = c.createGain(); g.gain.setValueAtTime(.35, t); g.gain.exponentialRampToValueAtTime(.001, t + .5);
    s.connect(lp); lp.connect(g); g.connect(this.master); s.start(t); s.stop(t + .55);
    const o = c.createOscillator(), og = c.createGain(); o.frequency.setValueAtTime(130, t + .4); o.frequency.exponentialRampToValueAtTime(55, t + .65);
    og.gain.setValueAtTime(.0001, t); og.gain.setValueAtTime(.3, t + .4); og.gain.exponentialRampToValueAtTime(.001, t + .7);
    o.connect(og); og.connect(this.master); o.start(t + .4); o.stop(t + .75);
  },
};

/* =====================================================================
   ВИТРИНА
   ===================================================================== */
function art(p, cls = '') {
  if (p.image) return `<img class="${cls}" src="${esc(p.image)}" alt="${esc(p.name)}" loading="lazy">`;
  return `<svg class="ph ${cls}" viewBox="0 0 120 150" role="img" aria-label="Место под фото: ${esc(p.name)}" preserveAspectRatio="xMidYMid meet">
    <rect class="bg" width="120" height="150" rx="8"/><path class="hatch" d="M-20 40 L60 -40 M-20 90 L110 -40 M-20 140 L130 -10 M10 170 L140 40 M60 170 L140 90"/>
    <text x="60" y="78" text-anchor="middle" font-size="11" letter-spacing="2">ФОТО</text><text x="60" y="102" text-anchor="middle" font-size="22">${p.code}</text></svg>`;
}
function renderShelves() {
  [[ 'shelf1', PRODUCTS.slice(0, 2) ], [ 'shelf2', PRODUCTS.slice(2, 4) ]].forEach(([id, list]) => {
    $(id).innerHTML = list.map(p => `
      <button class="slot" type="button" data-code="${p.code}" aria-label="${esc(p.name)}, код ${p.code}, ${fmtPrice(p.price)}">
        <span class="bag">${art(p)}</span>
        <span class="tag"><b>${p.code}</b><span>${fmtPrice(p.price)}</span></span>
      </button>`).join('');
  });
}

/* =====================================================================
   ПАНЕЛЬ: экран и клавиатура
   ===================================================================== */
const lcd = $('lcd'), l1 = $('l1'), codeLine = $('codeLine');
const MAX_CODE = 2;
let code = '', busy = false, resetTimer = 0;

function screen(line, mode = '') {
  l1.textContent = line; lcd.className = 'lcd ' + mode;
}
function showCode() {
  codeLine.innerHTML = `КОД ${esc(code)}<i>_</i>`;
}
function idle() {
  const max = PRODUCTS.length;
  screen(`Введите код товара 1–${max}`);
  showCode();
}
function pressDigit(d) {
  if (busy) return;
  clearTimeout(resetTimer);
  if (code.length >= MAX_CODE) return;
  code += d; Sound.key(); idle(); showCode();
  markPicked(code);
}
function clearCode() { if (busy) return; code = ''; Sound.key(); markPicked(''); idle(); }
function markPicked(c) { document.querySelectorAll('.slot').forEach(s => s.classList.toggle('picked', s.dataset.code === c)); }
function submit() {
  if (busy) return;
  if (!code) { screen('Сначала введите код', 'warn'); Sound.err(); return; }
  const p = PRODUCTS.find(x => String(x.code) === code);
  if (!p) {
    screen('Нет такого товара', 'bad'); Sound.err();
    resetTimer = setTimeout(() => { code = ''; markPicked(''); idle(); }, 1500);
    return;
  }
  busy = true; Sound.ok();
  screen(`№${p.code} · ${fmtPrice(p.price)}`);
  codeLine.textContent = 'ВЫДАЧА...';
  Sound.dispense();
  const bay = $('bay'); bay.querySelector('.drop')?.remove();
  const d = document.createElement('div'); d.className = 'drop'; d.innerHTML = `<span class="bag">${art(p)}</span>`; bay.appendChild(d);
  setTimeout(() => openCard(p), reduced ? 100 : 1300);
}
function buildKeys() {
  const k = $('keys'), labels = ['1', '2', '3', '4', '5', '6', '7', '8', '9', 'C', '0', 'OK'];
  k.innerHTML = labels.map(l => `<button class="key ${l === 'C' ? 'clr' : l === 'OK' ? 'ok' : ''}" type="button" data-k="${l}" aria-label="${l === 'C' ? 'Сбросить' : l === 'OK' ? 'Подтвердить' : l}">${l}</button>`).join('');
  k.addEventListener('click', e => {
    const b = e.target.closest('.key'); if (!b) return;
    const v = b.dataset.k; v === 'C' ? clearCode() : v === 'OK' ? submit() : pressDigit(v);
  });
}

/* =====================================================================
   КАРТОЧКА ТОВАРА
   ===================================================================== */
let lastFocus = null;
function openCard(p) {
  const href = `https://t.me/${encodeURIComponent(CONFIG.telegramUsername)}?text=${encodeURIComponent(CONFIG.orderText(p))}`;
  $('card').innerHTML = `
    <div class="pic"><span class="bag">${art(p)}</span></div>
    <div class="info">
      <div class="chips"><span class="code">Код ${p.code}</span><span>${esc(CONFIG.storeName)}</span></div>
      <h2 id="cName">${esc(p.name)}</h2>
      <div class="price">${fmtPrice(p.price)}</div>
      <p>${esc(p.desc)}</p>
      <dl>${Object.entries(p.details || {}).map(([k, v]) => `<dt>${esc(k)}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
      <div class="actions">
        <a class="btn" id="orderBtn" href="${href}" target="_blank" rel="noopener noreferrer">Заказать в Telegram</a>
        <button class="btn ghost" id="backBtn" type="button">Назад к автомату</button>
      </div>
      <div class="hint">Откроется чат в Telegram с готовым сообщением. Оплата и доставка обсуждаются в чате.</div>
    </div>`;
  lastFocus = document.activeElement;
  $('cardWrap').hidden = false;
  $('orderBtn').focus();
  $('backBtn').addEventListener('click', closeCard);
}
function closeCard() {
  $('cardWrap').hidden = true;
  busy = false; code = ''; markPicked(''); idle();
  $('bay').querySelector('.drop')?.remove();
  if (lastFocus && lastFocus.focus) lastFocus.focus();
}
$('cardWrap').addEventListener('click', e => { if (e.target === $('cardWrap')) closeCard(); });

/* =====================================================================
   КЛАВИАТУРА КОМПЬЮТЕРА
   ===================================================================== */
const EMBEDDED = window.parent !== window;
if (EMBEDDED) document.querySelector('.mute').style.right = 'max(78px, calc(env(safe-area-inset-right, 0px) + 78px))';   // открыт внутри XMB: Esc с экрана автомата закрывает магазин (это делает XMB)
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea')) return;
  if (!$('cardWrap').hidden) {
    if (e.key === 'Escape') { closeCard(); e.stopImmediatePropagation(); }
    if (e.key === 'Tab') {
      const f = [...$('card').querySelectorAll('a[href], button')];
      if (!f.length) return;
      const first = f[0], last = f[f.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
    return;
  }
  if ($('gate').classList.contains('gone') === false) return;
  const flash = k => { const b = document.querySelector(`.key[data-k="${k}"]`); if (b) { b.classList.add('press'); setTimeout(() => b.classList.remove('press'), 110); } };
  if (/^[0-9]$/.test(e.key)) { flash(e.key); pressDigit(e.key); }
  else if (e.key === 'Enter' && (e.target === document.body || e.target.classList.contains('key'))) { e.preventDefault(); flash('OK'); submit(); }
  else if (e.key === 'Escape' && EMBEDDED) { try { parent.postMessage({ type: 'xmb-exit' }, '*'); } catch (_) {} }
  else if (e.key === 'Backspace' || e.key === 'Escape' || e.key.toLowerCase() === 'c') { flash('C'); clearCode(); }
});
$('shelf1').addEventListener('click', slotClick); $('shelf2').addEventListener('click', slotClick);
function slotClick(e) {
  const s = e.target.closest('.slot'); if (!s || busy) return;
  code = s.dataset.code; Sound.key(); idle(); markPicked(code);
}

/* =====================================================================
   ВХОД В МАГАЗИН + «ПОДХОД» К АВТОМАТУ
   ===================================================================== */
/* playApproach: сюда позже встанет твоя анимация камеры. Сейчас это простой наезд:
   сцена стартует увеличенной (.approach) и плавно возвращается к обычному размеру. */
function playApproach() {
  const w = $('world');
  w.style.transitionDuration = reduced ? '.01s' : (CONFIG.approachMs / 1000) + 's';
  requestAnimationFrame(() => { w.classList.remove('approach'); w.classList.remove('blurred'); });
}
$('enter').addEventListener('click', () => {
  Sound.start();
  if (Sound.ctx && Sound.ctx.state === 'suspended') Sound.ctx.resume();
  $('gate').classList.add('gone');
  $('mute').hidden = !CONFIG.sound;
  playApproach();
});
$('mute').addEventListener('click', () => {
  const m = $('mute').getAttribute('aria-pressed') !== 'true';
  $('mute').setAttribute('aria-pressed', String(m));
  $('mute').setAttribute('aria-label', m ? 'Включить звук' : 'Выключить звук');
  Sound.setMuted(m);
});

/* =====================================================================
   ПАНЕЛЬ ВРЕМЕНИ (для проверки: можно прокрутить сутки)
   ===================================================================== */
$('timeChip').addEventListener('click', () => {
  const p = $('timePanel'), open = p.hidden; p.hidden = !open;
  $('timeChip').setAttribute('aria-expanded', String(open));
  if (open) $('timeRange').value = currentHour();
});
$('timeRange').addEventListener('input', e => { CONFIG.forceHour = parseFloat(e.target.value); applyTime(); });
$('timeAuto').addEventListener('click', () => { CONFIG.forceHour = null; $('timeRange').value = currentHour(); applyTime(); });

/* =====================================================================
   СТАРТ
   ===================================================================== */
(function stars() {
  const s = $('stars'); let h = '';
  for (let i = 0; i < 70; i++) h += `<i style="left:${(Math.random() * 100).toFixed(1)}%;top:${(Math.random() * 100).toFixed(1)}%;opacity:${(.3 + Math.random() * .7).toFixed(2)}"></i>`;
  s.innerHTML = h;
})();
renderShelves(); buildKeys(); idle(); applyTime();
setInterval(applyTime, 30000);
})();
</script>
</body>
